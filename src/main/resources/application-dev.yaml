spring:
  config:
    import: optional:file.env[.properties]
  application:
    name: animal-shelter
  datasource:
    url: jdbc:mysql://localhost:3306/animal_shelter?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${ENV_ROOT_USER:root}
    password: ${ENV_ROOT_PASSWORD:root}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
logging:
  level:
    shelter.animal: debug