services:
  mysql:
    image: mysql:9.0.1
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ENV_ROOT_PASSWORD}
      MYSQL_USER: ${ENV_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysql", "-u${ENV_MYSQL_USER}", "-p${ENV_MYSQL_PASSWORD}", "-e", "SELECT 1" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  app:
    build: .
    container_name: animal-shelter-app
    depends_on:
      mysql:
        condition: service_healthy
    tty: true
    stdin_open: true
    ports:
      - "8080:8080"