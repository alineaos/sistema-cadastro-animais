services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ENV_ROOT_PASSWORD}
      MYSQL_DATABASE: animal_shelter
      MYSQL_USER: ${ENV_MYSQL_USER}
      MYSQL_PASSWORD: ${ENV_MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p${ENV_ROOT_PASSWORD}"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 10s
    volumes:
      - "./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"

  app:
    build: .
    container_name: animal-shelter-app
    depends_on:
      mysql:
        condition: service_healthy
    tty: true
    stdin_open: true
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod